<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>みんなで仮想ドラフト2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>

/* Layout: a draft-room desk — candidate pool on the left, the club's pick sheet and the 12-team board on the right; lottery runs in an in-page overlay. */
:root{
  --paper:#eef1f5; --card:#ffffff; --ink:#15213a; --muted:#5a6578; --line:#d6dce5;
  --accent:#1d4fa6; --accent-soft:#e3ebf8; --accent-ink:#ffffff;
  --gold:#a87a1f; --gold-soft:#f6edd9; --warn:#b4472f; --ok:#2f7a4f;
  --k1:#dce7fa; --k2:#f6e5c3; --k3:#d6efdf; --k4:#f8d3cf;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1522; --card:#171f2f; --ink:#e5eaf2; --muted:#97a3b6; --line:#28334a;
  --accent:#7aa2ff; --accent-soft:#1d2b4a; --accent-ink:#0b1220;
  --gold:#e2b75a; --gold-soft:#3a2f17; --warn:#ec8467; --ok:#6cc596; --k1:#20345a; --k2:#4a3a18; --k3:#1c402c; --k4:#4f2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1522; --card:#171f2f; --ink:#e5eaf2; --muted:#97a3b6; --line:#28334a;
  --accent:#7aa2ff; --accent-soft:#1d2b4a; --accent-ink:#0b1220;
  --gold:#e2b75a; --gold-soft:#3a2f17; --warn:#ec8467; --ok:#6cc596; --k1:#20345a; --k2:#4a3a18; --k3:#1c402c; --k4:#4f2420; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 16px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(22px,3.6vw,32px)}
h2{font-size:18px}
h3{font-size:15px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.top p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:6px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* status strip */
.status{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:8px;padding:12px 16px}
.status .phase{font-family:var(--display);font-size:20px;white-space:nowrap}
.status .msg{min-width:0}
.status .msg b{color:var(--accent)}
@media (max-width:640px){.status{grid-template-columns:1fr}}

.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}.grid>.panel:last-child{order:-1}.pool{max-height:60vh}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.filters input[type=search]{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 10px;min-width:0;flex:1 1 140px;color:var(--ink)}
.chk{display:inline-flex;gap:5px;align-items:center;font-size:13px;color:var(--muted)}

/* pool rows */
.pool{display:flex;flex-direction:column;max-height:70vh;overflow:auto;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.row.taken{opacity:.5}
.grade{font-family:var(--mono);font-weight:600;font-size:15px;text-align:center;border-radius:6px;padding:2px 0;background:var(--accent-soft);color:var(--accent)}
.who{min-width:0}
.who .nm{font-weight:700;font-size:15px}
.who .meta{font-size:12.5px;color:var(--muted)}
.who .note{font-size:12.5px;margin-top:1px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:5px;vertical-align:1px;border:1px solid currentColor}
.tag.d2{color:var(--accent)}
.tag.d1{color:var(--muted)}
.tag.k{color:var(--gold)}
.tag.gone{color:var(--warn)}
.tag.j{color:var(--card);background:var(--ink);border-color:var(--ink)}

/* pick sheet */
.sheet{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:center}
.slot .rd{font-family:var(--display);font-size:15px;color:var(--accent)}
.slot .empty{color:var(--muted)}
.needs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.need{display:flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.need .mk{font-family:var(--mono);font-weight:600;width:16px;text-align:center}
.need.ok{border-color:var(--ok)}
.need.ok .mk{color:var(--ok)}
.need .mk{color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.board-wrap{overflow-x:auto}
table.board{border-collapse:collapse;font-size:12.5px;min-width:880px;width:100%}
.board th,.board td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top;white-space:nowrap}
.board th{background:var(--paper);font-weight:700;white-space:nowrap}

.board td .out{color:var(--muted)}
.board .rh{font-family:var(--display);font-weight:400;white-space:nowrap}
.board td.k1{background:var(--k1)}.board td.k2{background:var(--k2)}.board td.k3{background:var(--k3)}.board td.k4{background:var(--k4)}
.board td .bn{font-weight:700;font-size:13px}
.board td .bs{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.board th.d{background:var(--accent);color:var(--accent-ink)}
.board td.d{box-shadow:inset 3px 0 0 var(--accent),inset -3px 0 0 var(--accent)}
.board td.d:not([class*="k"]){background:var(--accent-soft)}
.board-sec{display:flex;flex-direction:column;gap:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
.legend i.k1{background:var(--k1)}.legend i.k2{background:var(--k2)}.legend i.k3{background:var(--k3)}.legend i.k4{background:var(--k4)}

.log{max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:2px;font-size:13px}
.log div{padding:3px 0;border-bottom:1px solid var(--line)}
.log .mine{color:var(--accent);font-weight:700}
.log .sys{color:var(--muted)}

.acts{display:flex;gap:6px;align-items:center}
.star{border:1px solid var(--line);background:transparent;border-radius:6px;width:30px;height:28px;font-size:16px;line-height:1;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.mylist{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.mylist .mi{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}
.mylist .mi span{min-width:0}
.save{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.save .line{display:flex;gap:8px;flex-wrap:wrap}
.save input{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 10px;font:inherit}
.save .note{font-size:12.5px;color:var(--muted);margin:0}
.save .ok{color:var(--ok);font-weight:700}
.saved{display:flex;flex-direction:column;gap:10px}
.sv{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.sv .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.sv .nm{font-weight:700;font-size:15px}
.sv ol{margin:0;padding-left:0;list-style:none;font-size:13px;display:grid;gap:2px}
.sv ol li b{display:inline-block;width:2.6em;color:var(--accent);font-family:var(--display);font-weight:400}
.sv .btns{display:flex;gap:6px;flex-wrap:wrap}
.btn.danger{color:var(--warn);border-color:var(--warn)}
#savedCount:not(:empty)::before{content:" "}
.gonebox{border:1px solid var(--gold);background:var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.gonebox ul{margin:4px 0 0;padding-left:18px}

.rules{font-size:13px;color:var(--muted)}
.rules summary{cursor:pointer;color:var(--ink);font-weight:700}
.rules ol{margin:6px 0 0;padding-left:20px}

/* lottery overlay */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--paper) 70%,transparent);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.lot{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.lot .who-big{font-family:var(--display);font-size:26px}
.bidders{display:flex;flex-wrap:wrap;gap:6px}
.bidders span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
.bidders span.d{border-color:var(--accent);color:var(--accent)}
.bidders span.win{background:var(--gold);border-color:var(--gold);color:var(--card)}
.envs{display:flex;flex-wrap:wrap;gap:10px}
.env{min-width:96px;padding:0 6px;height:56px;border:1px solid var(--line);border-radius:6px;background:var(--paper);position:relative;font-family:var(--display);font-size:13px}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;border-bottom:1px solid var(--line);clip-path:polygon(0 0,100% 0,50% 100%)}
.env:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.env.hit{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.stamp{display:inline-block;border:3px solid var(--gold);color:var(--gold);font-family:var(--display);padding:4px 12px;border-radius:6px;transform:rotate(-4deg);font-size:18px}
.stamp.lose{border-color:var(--warn);color:var(--warn)}
.result{display:flex;flex-direction:column;gap:12px}
.summary-list{display:flex;flex-direction:column}
@media (prefers-reduced-motion:reduce){.env:hover:not(:disabled){transform:none}}

/* --- multiplayer additions --- */
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.seat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:2px;min-height:58px}
.seat .tn{font-weight:700}
.seat .who{font-size:12.5px;color:var(--muted)}
.teamsw{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.seat.mine{border-color:var(--accent);background:var(--accent-soft)}
.seat.taken:not(.mine){background:var(--paper)}
.seat:disabled{cursor:default}
.lobby{display:flex;flex-direction:column;gap:12px}
.lobby .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lobby input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 10px;font:inherit;min-width:0;flex:0 1 220px}
.board th .thn{display:block;font-size:11px;font-weight:500;opacity:.85}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--warn)}
.people{display:flex;flex-direction:column;gap:4px;font-size:13px}
.people div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:3px 0}
.notice{border:1px solid var(--gold);background:var(--gold-soft);border-radius:8px;padding:12px 14px;font-size:13.5px}
.notice h3{margin-bottom:4px}
.bidsin{display:flex;flex-wrap:wrap;gap:6px}
.bidsin span{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700}
.bidsin span.done{background:var(--ok);border-color:var(--ok);color:var(--card)}
.bidsin span.wait{color:var(--muted)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>みんなで仮想ドラフト2026</h1>
      <p>参加者がそれぞれ自分のスマホやパソコンから球団を担当して、ドラフト会議をします。アカウントは不要です。人がいない球団は自動で指名。1位は全員同時に入札して抽選、2位以降はウェーバー方式（今年はパ・リーグ優先）、1回の持ち時間は3分です。</p>
    </div>
  </header>
  <p class="muted" style="margin:0;font-size:12.5px"><a href="index.html">トップへ</a>・<a href="solo.html">1人で遊ぶ（中日目線）</a></p>

  <section class="status" aria-live="polite">
    <div class="phase" id="phase">準備中</div>
    <div class="msg" id="msg">接続しています…</div>
    <div id="statusAct"></div>
  </section>

  <div id="noroom" hidden></div>

  <section class="panel lobby" id="lobby" hidden>
    <div class="panel-head"><h2>担当球団を選ぶ</h2><span class="muted" id="peopleCount"></span></div>
    <div class="line">
      <label for="nick" class="muted">ニックネーム</label>
      <input id="nick" maxlength="8" placeholder="8文字まで">
      <span class="muted" style="font-size:12.5px">ほかの参加者に表示されます</span>
    </div>
    <div class="line" id="shareLine"></div>
    <div class="seats" id="seats"></div>
    <div class="line" id="hostCtl"></div>
  </section>

  <div class="grid" id="game">
    <section class="panel" aria-labelledby="poolH">
      <div class="panel-head">
        <h2 id="poolH">候補選手</h2>
        <span class="muted num" id="poolCount"></span>
      </div>
      <div class="filters">
        <div class="seg" id="fCat" role="group" aria-label="区分">
          <button data-v="all" aria-pressed="true">全区分</button><button data-v="高">高校</button><button data-v="大">大学</button><button data-v="社">社会人</button><button data-v="独">独立</button>
        </div>
        <div class="seg" id="fPos" role="group" aria-label="ポジション">
          <button data-v="all" aria-pressed="true">全員</button><button data-v="RHP">右投</button><button data-v="LHP">左投</button><button data-v="C">捕</button><button data-v="IF">内</button><button data-v="OF">外</button>
        </div>
        <input type="search" id="fq" placeholder="名前・所属で検索" aria-label="名前・所属で検索">
        <label class="chk"><input type="checkbox" id="fStar">マイリストのみ</label>
        <label class="chk"><input type="checkbox" id="fTaken">指名済みも表示</label>
      </div>
      <div class="pool" id="pool"></div>
      <p class="muted" style="margin:0;font-size:12px">評価値は報道をもとにした目安。<span class="tag d2" style="margin:0">中日◎</span><span class="tag d1" style="margin:0">中日○</span>＝中日スカウトの関心、<span class="tag j" style="margin:0">J</span>＝日本代表経験。☆でマイリストに追加（このブラウザに保存）。</p>
    </section>

    <section class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="mine">自分の球団</button>
        <button role="tab" aria-selected="false" data-tab="people">参加者</button>
        <button role="tab" aria-selected="false" data-tab="log">指名ログ</button>
      </div>
      <div id="tab-mine" style="display:flex;flex-direction:column;gap:12px">
        <div id="bidsin"></div>
        <div id="mylist"></div>
        <div class="sheet" id="sheet"></div>
        <div id="copyBox"></div>
      </div>
      <div id="tab-people" hidden><div class="people" id="people"></div></div>
      <div id="tab-log" hidden><div class="log" id="log"></div></div>
    </section>
  </div>
</div>

<div class="wrap" style="padding-block:0 48px"><section class="panel board-sec" aria-labelledby="boardH">
  <div class="panel-head"><h2 id="boardH">12球団の指名ボード</h2>
    <div class="seg" id="fColor" role="group" aria-label="色分け"><button data-v="pos" aria-pressed="true">ポジションで色分け</button><button data-v="cat">区分で色分け</button></div></div>
  <div class="legend" id="legend"></div>
  <div class="board-wrap"><table class="board" id="board"></table></div>
</section></div>

<div class="overlay" id="overlay" hidden><div class="lot" id="lot" role="dialog" aria-modal="true"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* Firebase Realtime Database adapter: provides the same room/user interface the game uses */
(function(){
  const params=new URLSearchParams(location.search);
  const code=(params.get('room')||'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,24);
  window.__ROOM_CODE=code;
  window.__FB_OK=!!(window.firebase&&window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.databaseURL&&!/xxxx/.test(window.FIREBASE_CONFIG.databaseURL));
  if(!code||!window.__FB_OK)return;
  try{if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG)}catch(e){window.__FB_OK=false;return}
  const db=firebase.database();const base=db.ref('rooms/'+code);
  const me='p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
  const TS=firebase.database.ServerValue.TIMESTAMP;
  let peers={},myPres={},connected=false;const topicH={},peerH=[],connH=[];
  const myRef=base.child('players/'+me);
  const parse=s=>{try{return JSON.parse(s)}catch(e){return {}}};
  const snap=()=>Object.entries(peers).map(([peer,v])=>Object.freeze({peer,by:null,isMe:peer===me,sameTab:peer===me,kind:'viewer',guest:false,presence:Object.freeze(parse(v.p)),updatedAt:v.t||0}));
  base.child('players').on('value',s=>{
    const v=s.val()||{};const old=peers;peers=v;
    const joined=Object.keys(v).filter(k=>!old[k]),left=Object.keys(old).filter(k=>!v[k]),updated=Object.keys(v).filter(k=>old[k]&&old[k].p!==v[k].p);
    const ps=snap();const f=a=>ps.filter(p=>a.includes(p.peer));
    peerH.forEach(h=>{try{h({peers:ps,joined:f(joined),left:left.map(peer=>({peer})),updated:f(updated)})}catch(e){console.error(e)}});
  });
  const onEv=s=>{const v=s.val();if(!v||typeof v.d!=='string')return;const m={topic:s.key,data:parse(v.d),peer:v.p,by:null,isMe:v.p===me,sameTab:v.p===me,kind:'viewer',guest:false};(topicH[s.key]||[]).forEach(h=>{try{h(m)}catch(e){console.error(e)}})};
  base.child('events').on('child_added',onEv);base.child('events').on('child_changed',onEv);
  db.ref('.info/connected').on('value',s=>{connected=!!s.val();if(connected){myRef.onDisconnect().remove();myRef.set({p:JSON.stringify(myPres),t:TS})}connH.forEach(h=>h(connected))});
  const room={

    onPeers:h=>{peerH.push(h);setTimeout(()=>{const ps=snap();h({peers:ps,joined:ps,left:[],updated:[]})},0);return()=>{}},
    connected:()=>connected,
    onConnection:h=>{connH.push(h);setTimeout(()=>h(connected),0);return()=>{}}
  };
  const user={canEdit:async()=>true,id:async()=>me,isOwner:async()=>false};

})();

function emptyState(){return {v:0,phase:'lobby',seats:{},order:[],ended:[],iter:1,pending:[],bidsIn:[],reveal:null,round:2,idx:0,cur:null,remain:null}}
function takenSet(st){return new Set(st.order.map(o=>o[1]))}
function teamPicks(st,t){return st.order.filter(o=>o[0]===t)}
function pgrp(p){return (p.pos==='RHP'||p.pos==='LHP'||p.pos==='TW')?'P':p.pos}

/* ---------------- AI (host only) ---------------- */
function aiScore(st,team,p,noise,round){
  const cfg=AI[team];
  const raw=p.pos==='TW'?Math.max(cfg.need.RHP,cfg.need.IF):(cfg.need[p.pos]||1);
  const w=round<=1?.4:round<=3?.7:1;
  const need=Math.pow(raw,w);
  const g=pgrp(p);
  const have=teamPicks(st,team).filter(o=>pgrp(P[o[1]])===g).length;
  const tgt=cfg.quota[g]??1;
  const q=have<tgt?1+.03*(tgt-have):Math.pow(.86,have-tgt+1);
  const like=cfg.like.includes(p.n)?(round<=3?6:4):(cfg.weak||[]).includes(p.n)?(round<=3?2:2.5):0;
  return p.g*need*(cfg.cat[p.c]||1)*q+like+(Math.random()*2-1)*noise;
}
function aiBest(st,team,noise,round){
  const tk=takenSet(st);let best=null,bs=-1e9;
  for(const p of P){if(tk.has(p.id))continue;const s=aiScore(st,team,p,noise,round);if(s>bs){bs=s;best=p}}
  return best;
}
function aiBid(st,team){
  const tk=takenSet(st);
  if(st.iter===1){
    const opts=AI[team].fav.filter(([n])=>!tk.has(byName[n].id));
    const tot=opts.reduce((a,[,w])=>a+w,0);
    if(tot>0){let r=Math.random()*tot;for(const [n,w] of opts){r-=w;if(r<=0)return byName[n]}}
  }
  return aiBest(st,team,3,1);
}

/* ---------------- connection ---------------- */
const NET={room:null,user:null,me:null,isAdmin:false,isHost:false,hostPeer:null,lastStateAt:0,recvAt:0};
let ST=emptyState();
const L={nick:'',teams:[],active:null,seq:0,actKind:null,acts:[],bids:{}};
try{L.nick=localStorage.getItem('mp26-nick')||''}catch(e){}

async function connect(){
  if(!window.claude||!window.claude.use){showNoRoom('none');return}
  const [room,user]=await Promise.all([window.claude.use('room'),window.claude.use('user')]);
  if(!room){showNoRoom('none');return}
  NET.room=room;NET.user=user;
  NET.isAdmin=user?await user.canEdit():false;
  room.on('state',msg=>{
    if(!msg||!msg.data||msg.sameTab)return;
    const d=msg.data; if(typeof d!=='object')return;
    if(NET.isHost)return; // host owns state
    NET.hostPeer=msg.peer;NET.lastStateAt=Date.now();NET.recvAt=Date.now();
    ST=d;render();
  },()=>{});
  room.onPeers(ch=>{
    const me=ch.peers.find(p=>p.isMe&&p.sameTab);if(me)NET.me=me.peer;
    if(NET.isHost){
      for(const p of ch.left)hostPeerLeft(p.peer);
      for(const p of [...ch.joined,...ch.updated])hostProcessPeer(p);
      if(ch.joined.length)hostBroadcast(false);
    }
    renderPeople();renderLobby();
  },()=>{});
  room.onConnection(c=>{NET.connected=c;renderStatus()},()=>{showNoRoom('none')});
  pushPresence();
  setTimeout(()=>{render()},1500);
}
function showNoRoom(){
  const el=$('#noroom');el.hidden=false;
  if(!window.__FB_OK){
    el.innerHTML=`<div class="notice"><h3>Firebaseの設定がまだです</h3>firebase-config.js に、Firebaseのプロジェクト設定（apiKey や databaseURL など）を貼り付けてください。手順は README を見てください。候補リストと12球団ボードは、このまま見られます。</div>`;
    $('#phase').textContent='設定待ち';$('#msg').textContent='Firebaseの設定が入ると、対戦部屋が使えるようになります。';return;
  }
  el.innerHTML=`<div class="notice" style="display:flex;flex-direction:column;gap:8px"><h3>対戦部屋に入る</h3>
    <div>みんなで同じ<b>合言葉</b>を入れると、同じ部屋に入れます（半角英数字、24文字まで）。主催する人が合言葉を決めて、URLをLINEなどで送ってください。</div>
    <form id="joinForm" style="display:flex;gap:8px;flex-wrap:wrap"><input id="roomCode" maxlength="24" placeholder="例：dragons2026" style="border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 10px;font:inherit;flex:0 1 240px;min-width:0" required pattern="[A-Za-z0-9_-]+"><button class="btn primary" type="submit">この合言葉で入る</button></form></div>`;
  $('#joinForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#roomCode').value.toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,24);if(v)location.search='?room='+encodeURIComponent(v)});
  $('#phase').textContent='部屋を選ぶ';$('#msg').textContent='合言葉を入れて部屋に入ってください。';
}
function pushPresence(){
  if(!NET.room)return;
  const pres={nick:L.nick||'',team:L.teams[0]||null,teams:L.teams.slice(0,12),role:NET.isHost?'host':'player',acts:L.acts.slice(-8)};
  NET.room.presence(pres).catch(()=>{});
  if(NET.isHost&&NET.me)hostProcessPeer({peer:NET.me,presence:pres});
}
function sendAct(kind,pid,team){L.seq++;L.actKind={kind,pid,team};L.acts.push({seq:L.seq,kind,pid,team});if(L.acts.length>8)L.acts.shift();pushPresence()}
function doAct(team,kind,pid){if(NET.isHost)return hostAct(team,kind,pid);sendAct(kind,pid,team)}
function myTeams(){const me=NET.me;if(!me)return [];return TEAMS.map(t=>t.id).filter(t=>ST.seats&&ST.seats[t]===me)}
function myTeam(){
  const mine=myTeams();if(!mine.length)return null;
  if(ST.phase==='draft'&&mine.includes(ST.cur))return ST.cur;
  if(ST.phase==='reveal'&&ST.reveal&&ST.reveal.step>=0){const c=ST.reveal.contests[Math.min(ST.reveal.step,ST.reveal.contests.length-1)];
    if(c){const m=mine.filter(t=>c[1].includes(t));const u=m.find(t=>c[2]==null&&(c[3]||{})[t]==null);if(u)return u;if(m.length)return m[0]}}
  if(ST.phase==='bid'){const pend=mine.filter(t=>ST.pending.includes(t));if(pend.length){if(L.active&&pend.includes(L.active))return L.active;return pend.find(t=>!ST.bidsIn.includes(t)&&L.bids[t]==null)||pend[0]}}
  return L.active&&mine.includes(L.active)?L.active:mine[0];
}
function nickOf(peer){if(!NET.room)return '';const p=NET.room.peers().find(x=>x.peer===peer);return p&&p.presence&&typeof p.presence.nick==='string'?p.presence.nick.slice(0,8):''}
function hostPresent(){if(NET.isHost)return true;if(!NET.room)return false;return NET.room.peers().some(p=>p.presence&&p.presence.role==='host')&&Date.now()-NET.lastStateAt<15000}

/* ---------------- host engine ---------------- */
const H={bids:{},lastSeq:{},aiAt:0,deadline:0,nextAt:0,tick:null};
function becomeHost(){
  NET.isHost=true;ST=emptyState();
  try{const saved=JSON.parse(localStorage.getItem('mp26-host')||'null');if(saved&&saved.phase&&saved.phase!=='done'&&saved.phase!=='lobby'&&Date.now()-saved._t<3600000){ST=saved;delete ST._t;H.deadline=Date.now()+TURN_MS;H.aiAt=Date.now()+AI_DELAY;H.nextAt=Date.now()+REVEAL_MS}}catch(e){}
  pushPresence();
  if(NET.room)for(const p of NET.room.peers())hostProcessPeer(p);
  hostBroadcast(true);
  H.tick=setInterval(hostTick,400);
  setInterval(()=>hostBroadcast(false),4000);
}
function hostBroadcast(changed){
  if(!NET.isHost)return;
  if(changed)ST.v++;
  const now=Date.now();
  ST.remain=(ST.phase==='bid'||(ST.phase==='draft'&&ST.cur&&ST.seats[ST.cur]))?Math.max(0,H.deadline-now):(ST.phase==='reveal'&&H.drawDeadline)?Math.max(0,H.drawDeadline-now):null;
  NET.recvAt=now;
  if(NET.room){let msg=ST;if(JSON.stringify(msg).length>3800&&msg.reveal){msg={...ST,reveal:{...ST.reveal,bids:[]}}}NET.room.emit('state',msg).catch(()=>{})}
  if(changed){try{localStorage.setItem('mp26-host',JSON.stringify({...ST,_t:now}))}catch(e){}}
  render();
}
function hostPeerLeft(peer){
  let ch=false;
  for(const [t,p] of Object.entries(ST.seats))if(p===peer){delete ST.seats[t];ch=true;if(ST.phase==='draft'&&ST.cur===t)H.aiAt=Date.now()+AI_DELAY}
  delete H.lastSeq[peer];
  if(ch){hostCheckBidsComplete();if(!hostCheckDraw())hostBroadcast(true)}
}
function hostProcessPeer(p){
  if(!p||!p.presence)return;
  const pr=p.presence, peer=p.peer; let ch=false;
  // seat claim
  const wantL=Array.isArray(pr.teams)?pr.teams:(typeof pr.team==='string'?[pr.team]:[]);
  const want=new Set(wantL.filter(t=>typeof t==='string'&&TN[t]));
  for(const [t,v] of Object.entries(ST.seats))if(v===peer&&!want.has(t)){delete ST.seats[t];ch=true;if(ST.phase==='draft'&&ST.cur===t)H.aiAt=Date.now()+AI_DELAY}
  for(const t of want)if(!ST.seats[t]){ST.seats[t]=peer;ch=true;if(ST.phase==='draft'&&ST.cur===t)H.deadline=Date.now()+TURN_MS}
  // action
  const acts=(Array.isArray(pr.acts)?pr.acts:(pr.act?[pr.act]:[])).filter(a=>a&&typeof a.seq==='number').sort((x,y)=>x.seq-y.seq);
  for(const a of acts){
    if(a.seq<=(H.lastSeq[peer]||0))continue;
    H.lastSeq[peer]=a.seq;
    let team=typeof a.team==='string'&&ST.seats[a.team]===peer?a.team:null;
    if(!team&&!a.team){const own=Object.entries(ST.seats).filter(([,v])=>v===peer);if(own.length===1)team=own[0][0]}
    if(team){if(ch){hostCheckBidsComplete();hostBroadcast(true);ch=false}hostAct(team,a.kind,a.pid)}
  }
  if(ch){hostCheckBidsComplete();hostBroadcast(true)}
}
function hostAct(team,kind,pid){
  const tk=takenSet(ST);
  if(kind==='bid'&&ST.phase==='bid'&&ST.pending.includes(team)&&P[pid]&&!tk.has(pid)){
    H.bids[team]=pid;if(!ST.bidsIn.includes(team))ST.bidsIn.push(team);
    if(!hostCheckBidsComplete())hostBroadcast(true);return true;
  }
  if(kind==='pick'&&ST.phase==='draft'&&ST.cur===team&&P[pid]&&!tk.has(pid)){
    ST.order.push([team,pid,ST.round,0]);hostAdvance();return true;
  }
  if(kind==='env'&&ST.phase==='reveal'&&ST.reveal&&ST.reveal.step>=0&&H.drawDeadline){
    const c=ST.reveal.contests[ST.reveal.step];
    if(c&&c[2]==null&&c[1].includes(team)&&c[3][team]==null&&Number.isInteger(pid)&&pid>=0&&pid<c[1].length&&!Object.values(c[3]).includes(pid)){
      c[3][team]=pid;if(!hostCheckDraw())hostBroadcast(true);return true;
    }
    return false;
  }
  if(kind==='end'&&ST.phase==='draft'&&ST.cur===team){ST.ended.push(team);hostAdvance();return true}
  return false;
}
function humanPending(){return ST.pending.filter(t=>ST.seats[t])}
function hostCheckBidsComplete(){
  if(ST.phase!=='bid')return false;
  if(humanPending().every(t=>ST.bidsIn.includes(t))){hostResolveBids();return true}
  return false;
}
function hostReset(){
  const seats=ST.seats;ST=emptyState();ST.seats=seats;H.bids={};H.lastSeq={...H.lastSeq};
  try{localStorage.removeItem('mp26-host')}catch(e){}
  hostBroadcast(true);
}
let resetConfirm=0;
function hostStart(){
  ST.phase='bid';ST.iter=1;ST.pending=TEAMS.map(t=>t.id);ST.bidsIn=[];ST.order=[];ST.ended=[];H.bids={};H.deadline=Date.now()+TURN_MS;
  if(!hostCheckBidsComplete())hostBroadcast(true);
}
function hostResolveBids(){
  const bids={};
  for(const t of ST.pending){const pid=H.bids[t];bids[t]=(pid!=null&&!takenSet(ST).has(pid))?pid:aiBid(ST,t).id}
  const groups={};for(const [t,pid] of Object.entries(bids))(groups[pid]=groups[pid]||[]).push(t);
  const singles=[],contests=[];
  for(const [pid,ts] of Object.entries(groups)){if(ts.length===1)singles.push([ts[0],+pid]);else contests.push([+pid,ts,null,{}])}
  const flag=ST.iter===1?0:1;
  for(const [t,pid] of singles){ST.order.push([t,pid,1,flag])}
  ST.pending=ST.pending.filter(t=>!singles.some(s=>s[0]===t));
  ST.reveal={label:ST.iter===1?'1巡目':'外れ1位（'+ST.iter+'回目）',singles,contests,step:-1,bids:Object.entries(bids)};
  H.hits=contests.map(c=>Math.floor(Math.random()*c[1].length));H.drawDeadline=0;
  ST.phase='reveal';H.nextAt=Date.now()+(contests.length?6000:5000);H.bids={};
  hostBroadcast(true);
}
function hostRevealStep(){
  const R=ST.reveal;R.step++;
  if(R.step<R.contests.length){const c=R.contests[R.step];
    if(!c[1].some(t=>ST.seats[t])){hostFinishDraw();return}
    H.drawDeadline=Date.now()+DRAW_MS;H.nextAt=Infinity;hostBroadcast(true);return}
  const flag=ST.iter===1?0:1;
  for(const [pid,ts,w] of R.contests){ST.order.push([w,pid,1,flag]);ST.pending=ST.pending.filter(t=>t!==w)}
  ST.reveal=null;
  if(ST.pending.length){ST.iter++;ST.phase='bid';ST.bidsIn=[];H.deadline=Date.now()+TURN_MS;if(!hostCheckBidsComplete())hostBroadcast(true);return}
  ST.phase='draft';ST.round=2;ST.idx=0;hostStartTurn();
}
function hostFinishDraw(){
  const R=ST.reveal;const c=R.contests[R.step];const n=c[1].length;
  const used=new Set(Object.values(c[3]));
  const free=[...Array(n).keys()].filter(i=>!used.has(i)).sort(()=>Math.random()-.5);
  for(const t of c[1])if(c[3][t]==null)c[3][t]=free.shift();
  const hit=H.hits[R.step];c[2]=c[1].find(t=>c[3][t]===hit);
  H.drawDeadline=0;H.nextAt=Date.now()+REVEAL_MS+1500;hostBroadcast(true);
}
function hostCheckDraw(){
  if(ST.phase!=='reveal'||!ST.reveal||ST.reveal.step<0||!H.drawDeadline)return false;
  const c=ST.reveal.contests[ST.reveal.step];if(!c||c[2])return false;
  if(c[1].filter(t=>ST.seats[t]).every(t=>c[3][t]!=null)){hostFinishDraw();return true}
  return false;
}
function hostAdvance(){ST.idx++;hostStartTurn()}
function hostStartTurn(){
  while(ST.round<=ROUNDS){
    const order=orderFor(ST.round);
    if(ST.idx>=order.length){ST.round++;ST.idx=0;continue}
    const t=order[ST.idx];
    if(ST.ended.includes(t)){ST.idx++;continue}
    ST.cur=t;H.deadline=Date.now()+TURN_MS;H.aiAt=Date.now()+AI_DELAY;hostBroadcast(true);return;
  }
  ST.cur=null;ST.phase='done';hostBroadcast(true);
}
function hostTick(){
  const now=Date.now();
  if(NET.room&&now-(H.lastClean||0)>5000){H.lastClean=now;const live=new Set(NET.room.peers().map(p=>p.peer));if(live.size){let ch=false;for(const [t,p] of Object.entries(ST.seats))if(!live.has(p)){delete ST.seats[t];ch=true;if(ST.phase==='draft'&&ST.cur===t)H.aiAt=now+AI_DELAY}if(ch){hostCheckBidsComplete();hostBroadcast(true);return}}}
  if(ST.phase==='bid'&&now>=H.deadline){hostResolveBids();return}
  if(ST.phase==='reveal'&&H.drawDeadline&&now>=H.drawDeadline){hostFinishDraw();return}
  if(ST.phase==='reveal'&&!H.drawDeadline&&now>=H.nextAt){hostRevealStep();return}
  if(ST.phase==='draft'&&ST.cur){
    const human=!!ST.seats[ST.cur];
    if(!human&&now>=H.aiAt){
      const r=ST.round;
      if(Math.random()<END_PROB[r]){ST.ended.push(ST.cur)}else{const p=aiBest(ST,ST.cur,r<=3?3:5,r);if(p)ST.order.push([ST.cur,p.id,r,0]);else ST.ended.push(ST.cur)}
      hostAdvance();return;
    }
    if(human&&now>=H.deadline){const p=aiBest(ST,ST.cur,3,ST.round);if(p)ST.order.push([ST.cur,p.id,ST.round,2]);hostAdvance();return}
  }
}

/* ---------------- UI state ---------------- */
const ui={color:'pos',cat:'all',pos:'all',q:'',starOnly:false,showTaken:false};
let STAR=new Set();
try{const v=localStorage.getItem('mp26-star');STAR=new Set(v?JSON.parse(v):[])}catch(e){STAR=new Set()}
function saveStar(){try{localStorage.setItem('mp26-star',JSON.stringify([...STAR]))}catch(e){}}

function remainMs(){if(ST.remain==null)return null;return Math.max(0,ST.remain-(Date.now()-NET.recvAt))}
function fmt(ms){const s=Math.ceil(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}

/* ---------------- render ---------------- */
function render(){renderStatus();renderLobby();renderPool();renderMine();renderBoard();renderLog();renderPeople();renderReveal()}
function canBid(){const t=myTeam();return ST.phase==='bid'&&t&&ST.pending.includes(t)}
function canPick(){const t=myTeam();return ST.phase==='draft'&&t&&ST.cur===t}
function renderStatus(){
  const ph=$('#phase'),msg=$('#msg'),act=$('#statusAct');
  if(!NET.room){return}
  const t=myTeam();act.innerHTML='';
  if(!NET.isHost&&!hostPresent()&&ST.phase==='lobby'){
    ph.textContent='待機中';
    msg.innerHTML=NET.isAdmin?'主催者がまだいません。あなたが主催できます。':'主催者が部屋を開くのを待っています。担当したい球団は先に選んでおけます。';
    if(NET.isAdmin){const b=document.createElement('button');b.className='btn primary';b.textContent='この端末で主催する';b.onclick=becomeHost;act.appendChild(b)}
    return;
  }
  const tm=remainMs();
  if(ST.phase==='lobby'){ph.textContent='ロビー';msg.innerHTML='担当球団を選んでください。'+(NET.isHost?'そろったら<b>ドラフト開始</b>を押します。':'主催者がドラフトを始めるまでお待ちください。')}
  else if(ST.phase==='bid'){
    ph.textContent=ST.iter===1?'1巡目 入札':'外れ1位 入札';
    const mp=myTeams().filter(x=>ST.pending.includes(x));const nm=mp.length>1?`（${TN[t]}）`:'';
    msg.innerHTML=canBid()?(ST.bidsIn.includes(t)?`${nm}入札しました。ほかの参加者を待っています（入札は変更できます）。`:`<b>${nm}入札する選手</b>を選んでください。全員そろうか時間切れで一斉に公開します。`):'参加者の入札を待っています。';
    if(mp.length>1){const w=document.createElement('div');w.className='teamsw';w.innerHTML=mp.map(x=>`<button class="btn small${x===t?' primary':''}" data-sw="${x}">${TN[x]}${ST.bidsIn.includes(x)?' ✓':''}</button>`).join('');act.appendChild(w)}
  } else if(ST.phase==='reveal'){ph.textContent='抽選';msg.textContent='入札結果を公開しています。'}
  else if(ST.phase==='draft'){
    const no=orderFor(ST.round).indexOf(ST.cur)+1;
    ph.textContent=`${ST.round}巡目`;
    msg.innerHTML=canPick()?`<b>あなた（${TN[t]}）の番です。</b>指名する選手を選んでください。`:`${TN[ST.cur]||''}の番です（${ST.round}巡目の<span class="num">${no}</span>番目）${ST.seats[ST.cur]?`・${esc(nickOf(ST.seats[ST.cur])||'参加者')}が考え中`:'・自動指名'}。`;
    if(canPick()){const b=document.createElement('button');b.className='btn small';b.textContent='ここで指名終了';b.onclick=()=>{if(NET.isHost)hostAct(t,'end');else sendAct('end',null,t)};act.appendChild(b)}
  } else if(ST.phase==='done'){ph.textContent='指名終了';msg.textContent=NET.isHost?'全球団の指名が終わりました。「もう一度ドラフトする」で担当球団はそのままロビーに戻ります。':'全球団の指名が終わりました。主催者がもう一度始めるのを待っています。'}
  if(NET.isHost&&ST.phase!=='lobby'){
    const b=document.createElement('button');b.className='btn small'+(ST.phase==='done'?' primary':' danger');
    if(ST.phase==='done'){b.textContent='もう一度ドラフトする';b.onclick=hostReset}
    else{const armed=Date.now()-resetConfirm<4000;b.textContent=armed?'本当にやり直す':'最初からやり直す';b.onclick=()=>{if(Date.now()-resetConfirm<4000){resetConfirm=0;hostReset()}else{resetConfirm=Date.now();renderStatus()}}}
    act.appendChild(b);
  }
  if(tm!=null&&(ST.phase==='bid'||(ST.phase==='draft'&&ST.seats[ST.cur]))){
    const d=document.createElement('div');d.className='timer'+(tm<30000?' low':'');d.textContent=fmt(tm);d.id='timer';act.prepend(d);
  }
}
function renderLobby(){
  const lb=$('#lobby');
  if(!NET.room){lb.hidden=true;return}
  lb.hidden=!(ST.phase==='lobby'||ST.phase==='bid'||ST.phase==='draft');
  if(ST.phase!=='lobby'){lb.querySelector('h2').textContent='担当球団（空いている球団は途中から参加できます）'}
  else lb.querySelector('h2').textContent='担当球団を選ぶ';
  const me=NET.me;
  $('#seats').innerHTML=TEAMS.map(t=>{
    const holder=ST.seats[t.id];const mine=holder&&holder===me;const want=L.teams.includes(t.id)&&!mine;
    const who=holder?(mine?'あなた':esc(nickOf(holder)||'参加者')):(want?'確認中…':'自動指名');
    return `<button class="seat${holder?' taken':''}${mine?' mine':''}" data-seat="${t.id}" ${holder&&!mine?'disabled':''} aria-pressed="${!!mine}"><span class="tn">${t.n}</span><span class="who">${who}</span></button>`;
  }).join('');
  const n=NET.room.peers().length;$('#peopleCount').textContent=`接続中 ${n}人`;
  const hc=$('#hostCtl');
  hc.innerHTML=NET.isHost&&ST.phase==='lobby'?`<button class="btn primary" id="startBtn">ドラフト開始</button><span class="muted" style="font-size:12.5px">人がいない球団は自動で指名します。あなたも担当球団を選べます（1台で複数の球団もOK。選ばなければ司会だけ）。</span>`:'';
  const sb=$('#startBtn');if(sb)sb.onclick=hostStart;
}
function renderPool(){
  const tk=takenSet(ST);const bid=canBid(),pick=canPick();
  const myBid=bid?L.bids[myTeam()]??null:null;
  const q=ui.q.trim();
  const list=P.filter(p=>{
    if(!ui.showTaken&&tk.has(p.id))return false;
    if(ui.cat!=='all'&&p.c!==ui.cat)return false;
    if(ui.pos!=='all'){if(ui.pos==='RHP'?!(p.pos==='RHP'||p.pos==='TW'):ui.pos==='IF'?!(p.pos==='IF'||p.pos==='TW'):p.pos!==ui.pos)return false}
    if(ui.starOnly&&!STAR.has(p.n))return false;
    if(q&&!(p.n.includes(q)||p.t.includes(q)))return false;
    return true;
  }).sort((a,b)=>b.g-a.g);
  $('#poolCount').textContent=`残り ${P.length-tk.size}人`;
  const takenBy={};for(const o of ST.order)takenBy[o[1]]=o;
  $('#pool').innerHTML=list.map(p=>{
    const o=takenBy[p.id];
    const tags=jtag(p.n)+(p.d===2?'<span class="tag d2">中日◎</span>':p.d===1?'<span class="tag d1">中日○</span>':'')+(o?`<span class="tag gone">${TN[o[0]]} ${o[2]}位</span>`:'');
    let btn='';
    if(!o&&bid)btn=`<button class="btn small ${myBid===p.id?'':'primary'}" data-act="bid" data-id="${p.id}">${myBid===p.id?'入札中':'入札する'}</button>`;
    else if(!o&&pick)btn=`<button class="btn small primary" data-act="pick" data-id="${p.id}">指名する</button>`;
    const st=STAR.has(p.n);
    return `<div class="row${o?' taken':''}"><div class="grade">${p.g}</div><div class="who"><div class="nm">${esc(p.n)}${tags}</div><div class="meta">${esc(p.t)}・${CATL[p.c]}・${POSL[p.pos]}</div><div class="note">${esc(p.note)}</div></div><div class="acts"><button class="star" data-star="${p.id}" aria-pressed="${st}" aria-label="マイリスト">${st?'★':'☆'}</button>${btn}</div></div>`;
  }).join('')||'<p class="muted" style="padding:12px 4px">条件に合う選手がいません。</p>';
}
function renderMine(){
  const t=myTeam();
  const bi=$('#bidsin');
  if(ST.phase==='bid'){
    bi.innerHTML=`<div><h3 style="margin-bottom:6px">入札状況</h3><div class="bidsin">${ST.pending.filter(x=>ST.seats[x]).map(x=>`<span class="${ST.bidsIn.includes(x)?'done':'wait'}">${TN[x]} ${ST.bidsIn.includes(x)?'入札済み':'考え中'}</span>`).join('')||'<span class="muted">参加者の入札はありません</span>'}</div><p class="muted" style="font-size:12px;margin:6px 0 0">入札先は公開まで見えません。人がいない球団は公開時に自動で入札します。</p></div>`;
  } else bi.innerHTML='';
  const tk=takenSet(ST);
  const my=P.filter(p=>STAR.has(p.n)&&!tk.has(p.id)).sort((a,b)=>b.g-a.g);
  const act=canBid()?'bid':canPick()?'pick':null;
  $('#mylist').innerHTML=ST.phase==='done'?'':`<div class="mylist"><div class="panel-head"><h3>マイリスト</h3><span class="muted num" style="font-size:12px">残り ${my.length}人</span></div>${my.slice(0,8).map(p=>`<div class="mi"><span><b>${esc(p.n)}</b>${jtag(p.n)} <span class="muted">${esc(p.t)}・${POSL[p.pos]}・${p.g}</span></span>${act?`<button class="btn small primary" data-act="${act}" data-id="${p.id}">${act==='bid'?'入札':'指名'}</button>`:''}</div>`).join('')||(STAR.size?'<div class="muted" style="font-size:13px">マイリストの選手は残っていません。</div>':'<div class="muted" style="font-size:13px">マイリストはまだ空です。候補リストの☆で追加できます（このブラウザに保存）。</div>')}</div>`;
  if(!t){$('#sheet').innerHTML='<p class="muted" style="margin:0">担当球団を選ぶと、ここに指名した選手が並びます。</p>';$('#copyBox').innerHTML='';return}
  let h='';
  for(const tt of myTeams()){
  h+=`<h3 style="margin:${h?'14px':'0'} 0 4px">${TN[tt]}の指名</h3>`;
  for(let r=1;r<=ROUNDS;r++){
    const o=ST.order.find(x=>x[0]===tt&&x[2]===r);
    h+=`<div class="slot"><div class="rd">${r}位</div>${o?`<div><b>${esc(P[o[1]].n)}</b>${jtag(P[o[1]].n)}　<span class="muted">${esc(P[o[1]].t)}・${POSL[P[o[1]].pos]}${o[3]===1?'・外れ1位':''}${o[3]===2?'・時間切れで自動':''}</span></div>`:`<div class="empty">${ST.ended.includes(tt)&&r>1?'選択終了':'—'}</div>`}</div>`;
  }}
  $('#sheet').innerHTML=h;
  $('#copyBox').innerHTML=ST.phase==='done'?`<button class="btn" id="copyRes" data-label="結果をコピー">結果をコピー</button>`:'';
  const cb=$('#copyRes');if(cb)cb.onclick=()=>copyText(myTeams().map(resultText).join('\n\n'),cb);
}
function resultText(t){
  const lines=[`【みんなで仮想ドラフト2026】${TN[t]}`];
  for(const o of ST.order.filter(x=>x[0]===t))lines.push(`${o[3]===1?'1位(外れ)':o[2]+'位'} ${P[o[1]].n}（${P[o[1]].t}・${POSL[P[o[1]].pos]}）`);
  return lines.join('\n');
}
async function copyText(txt,btn){
  try{await navigator.clipboard.writeText(txt);btn.textContent='コピーしました'}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');btn.textContent='コピーしました'}catch(_){btn.textContent='コピーできませんでした'}ta.remove()}
  setTimeout(()=>{btn.textContent=btn.dataset.label},1800);
}
const COLORMAP={pos:{RHP:'k1',LHP:'k1',TW:'k1',C:'k3',IF:'k2',OF:'k4'},cat:{'大':'k1','高':'k2','社':'k3','独':'k4'}};
const LEGEND={pos:[['k1','投手'],['k3','捕手'],['k2','内野手'],['k4','外野手']],cat:[['k2','高校'],['k1','大学'],['k3','社会人'],['k4','独立']]};
const POSS={RHP:'投・右',LHP:'投・左',TW:'投・内',C:'捕',IF:'内',OF:'外'};
function renderBoard(){
  $('#legend').innerHTML=LEGEND[ui.color].map(([k,l])=>`<span><i class="${k}"></i>${l}</span>`).join('')+'<span class="muted">担当者がいる球団は見出しに名前、あなたの球団は青枠</span>';
  const t0=myTeam();
  let h='<thead><tr><th></th>'+TEAMS.map(t=>{const s=ST.seats[t.id];return `<th class="${myTeams().includes(t.id)?'d':''}">${t.n}${s?`<span class="thn">${esc(s===NET.me?'あなた':(nickOf(s)||'参加者'))}</span>`:''}</th>`}).join('')+'</tr></thead><tbody>';
  for(let r=1;r<=ROUNDS;r++){
    h+=`<tr><th class="rh">${r}位</th>`;
    for(const t of TEAMS){
      const o=ST.order.find(x=>x[0]===t.id&&x[2]===r);const d=myTeams().includes(t.id)?' d':'';
      if(o){const p=P[o[1]];const k=COLORMAP[ui.color][ui.color==='pos'?p.pos:p.c];h+=`<td class="${k}${d}"><span class="bn">${esc(p.n)}</span>${jtag(p.n)}<span class="bs">${POSS[p.pos]}・${esc(p.t)}${o[3]===1?'・外れ':''}${o[3]===2?'・自動':''}</span></td>`}
      else if(ST.phase==='draft'&&ST.cur===t.id&&ST.round===r)h+=`<td class="${d.trim()}"><span class="out">指名中…</span></td>`;
      else if(ST.ended.includes(t.id)&&r>1&&!ST.order.some(x=>x[0]===t.id&&x[2]>r))h+=`<td class="${d.trim()}"><span class="out">選択終了</span></td>`;
      else h+=`<td class="${d.trim()}"></td>`;
    }
    h+='</tr>';
  }
  $('#board').innerHTML=h+'</tbody>';
}
function renderLog(){
  $('#log').innerHTML=[...ST.order].reverse().map(o=>{const p=P[o[1]];const head=o[2]===1?'第1回選択希望選手':`第${o[2]}巡選択希望選手`;return `<div class="${myTeams().includes(o[0])?'mine':''}">${head}　${TN[o[0]]}　${esc(p.n)}　${POSA[p.pos]}　${esc(p.t)}${o[3]===1?'（外れ1位）':''}${o[3]===2?'（時間切れ・自動）':''}</div>`}).join('')||'<div class="sys">まだ指名はありません。</div>';
}
function renderPeople(){
  if(!NET.room){$('#people').innerHTML='';return}
  $('#people').innerHTML=NET.room.peers().map(p=>{const pr=p.presence||{};const seat=Object.entries(ST.seats).find(([,v])=>v===p.peer);return `<div><span>${esc((typeof pr.nick==='string'&&pr.nick.slice(0,8))||'名前未設定')}${p.isMe&&p.sameTab?'（あなた）':''}${pr.role==='host'?' <span class="tag k">主催</span>':''}</span><span class="muted">${seat?TN[seat[0]]:'観戦'}</span></div>`}).join('');
}
function renderReveal(){
  const ov=$('#overlay'),box=$('#lot');
  if(ST.phase!=='reveal'||!ST.reveal){ov.hidden=true;return}
  ov.hidden=false;const R=ST.reveal;const t0=myTeam();
  const bidList=R.bids.map(([t,pid])=>`<div>${TN[t]}：<b>${esc(P[pid].n)}</b>${ST.seats[t]?'':' <span class="muted">（自動）</span>'}</div>`).join('');
  if(R.step<0){
    box.innerHTML=`<h2>${esc(R.label)} 入札結果</h2><div class="summary-list" style="font-size:13.5px">${bidList}</div>${R.contests.length?`<p style="margin:0"><b>${R.contests.length}件の競合</b>があります。まもなく抽選します。</p>`:'<p class="muted" style="margin:0">競合はありませんでした。</p>'}`;
    return;
  }
  const i=Math.min(R.step,R.contests.length-1);const c=R.contests[i];
  if(!c){box.innerHTML='<p>抽選を終えています…</p>';return}
  const [pid,ts,w,env]=c;const mineIn=t0&&ts.includes(t0);const myIn=ts.filter(x=>myTeams().includes(x));const e=env||{};
  const byEnv={};for(const [t,k] of Object.entries(e))byEnv[k]=t;
  const canDraw=mineIn&&!w&&e[t0]==null;
  const hitIdx=w?e[w]:null;
  const envs=ts.map((_,k)=>{const who=byEnv[k];const free=who==null;
    return `<button class="env${hitIdx===k?' hit':''}" data-env="${k}" ${canDraw&&free?'':'disabled'} aria-label="封筒${k+1}">${k+1}<span style="display:block;font-size:11px;font-family:var(--body);font-weight:700">${who?esc(TN[who]):''}</span></button>`}).join('');
  const tm=remainMs();
  let line;
  if(w)line=`<div><span class="stamp${mineIn&&w!==t0?' lose':''}">${mineIn?(w===t0?'交渉権確定':'外れ'):'交渉権確定'}</span><p style="margin:8px 0 0">当たりは封筒${hitIdx+1}。${TN[w]}が交渉権を獲得しました。</p></div>`;
  else if(canDraw)line=`<p style="margin:0"><b>${myIn.length>1?TN[t0]+'の':''}封筒を1つ選んでください。</b>当たりは${ts.length}つのうち1つ。${tm!=null?`残り <span class="num">${fmt(tm)}</span>（時間切れは自動）`:''}</p>`;
  else line=`<p style="margin:0">${mineIn?'封筒を選びました。ほかの球団を待っています…':'各球団が封筒を選んでいます…'}${tm!=null?` 残り <span class="num">${fmt(tm)}</span>`:''}<br><span class="muted" style="font-size:12.5px">担当者がいない球団は、最後に残った封筒を自動で引きます。</span></p>`;
  box.innerHTML=`<p class="muted num" style="margin:0">抽選 ${i+1} / ${R.contests.length}</p><div class="who-big">${esc(P[pid].n)}</div><div class="muted">${esc(P[pid].t)}・${POSL[P[pid].pos]}</div>
    <div class="bidders">${ts.map(t=>`<span class="${myTeams().includes(t)?'d':''}${w===t?' win':''}">${TN[t]}${ST.seats[t]?'':'（自動）'}</span>`).join('')}</div>
    <div class="envs">${envs}</div>${line}`;
}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){const id=+a.dataset.id;const t=myTeam();if(!t)return;
    if(a.dataset.act==='bid'){L.bids[t]=id;doAct(t,'bid',id);const nx=myTeams().filter(x=>ST.pending.includes(x)&&x!==t&&!ST.bidsIn.includes(x)&&L.bids[x]==null)[0];L.active=nx||t;render()}
    else{if(NET.isHost)hostAct(t,'pick',id);else{sendAct('pick',id,t);a.disabled=true;a.textContent='送信中…'}}
    return}
  const en=e.target.closest('[data-env]');
  if(en&&!en.disabled){const t=myTeam();if(!t)return;const k=+en.dataset.env;if(NET.isHost)hostAct(t,'env',k);else{sendAct('env',k,t);en.disabled=true}return}
  const sw=e.target.closest('[data-sw]');
  if(sw){L.active=sw.dataset.sw;render();return}
  const sb=e.target.closest('[data-star]');
  if(sb){const p=P[+sb.dataset.star];STAR.has(p.n)?STAR.delete(p.n):STAR.add(p.n);saveStar();renderPool();renderMine();return}
  const st=e.target.closest('[data-seat]');
  if(st){const t=st.dataset.seat;const mine=ST.seats[t]&&ST.seats[t]===NET.me;const i=L.teams.indexOf(t);if(mine||i>=0){L.teams=L.teams.filter(x=>x!==t)}else L.teams.push(t);pushPresence();renderLobby();renderMine();renderBoard();return}
  const seg=e.target.closest('.seg button');
  if(seg){const g=seg.parentElement;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===seg));
    if(g.id==='fColor'){ui.color=seg.dataset.v;renderBoard();return}
    if(g.id==='fCat')ui.cat=seg.dataset.v;else ui.pos=seg.dataset.v;renderPool();return}
  const tab=e.target.closest('[role=tab]');
  if(tab){document.querySelectorAll('[role=tab]').forEach(x=>x.setAttribute('aria-selected',x===tab));
    ['mine','people','log'].forEach(k=>{$('#tab-'+k).hidden=k!==tab.dataset.tab});return}
});
$('#nick').value=L.nick;
$('#nick').addEventListener('change',e=>{L.nick=e.target.value.trim().slice(0,8);try{localStorage.setItem('mp26-nick',L.nick)}catch(_){}pushPresence();renderPeople()});
$('#fq').addEventListener('input',e=>{ui.q=e.target.value;renderPool()});
$('#fStar').addEventListener('change',e=>{ui.starOnly=e.target.checked;renderPool()});
$('#fTaken').addEventListener('change',e=>{ui.showTaken=e.target.checked;renderPool()});
setInterval(()=>{if(ST.phase==='reveal')renderReveal();},1000);
setInterval(()=>{const tm=$('#timer');const r=remainMs();if(tm&&r!=null){tm.textContent=fmt(r);tm.classList.toggle('low',r<30000)}
  if(!NET.isHost&&NET.room&&ST.phase!=='lobby'&&!hostPresent()){$('#msg').textContent='主催者との接続が切れています。再接続を待っています…'}},500);
// after a pick is applied, clear pending act
let lastV=-1,lastIter=-1;setInterval(()=>{if(ST.v!==lastV){lastV=ST.v;if(L.actKind&&L.actKind.kind==='pick'&&!canPick())L.actKind=null;if(L.actKind&&L.actKind.kind==='bid'&&(ST.phase!=='bid'||ST.iter!==lastIter))L.actKind=null;if(ST.phase!=='bid'||ST.iter!==lastIter){L.bids={};}lastIter=ST.iter}},300);
render();
(function(){const sl=$('#shareLine');if(!sl||!window.__ROOM_CODE)return;const url=location.origin+location.pathname+'?room='+encodeURIComponent(window.__ROOM_CODE);
  sl.innerHTML=`<span class="muted">合言葉：<b style="color:var(--ink)">${esc(window.__ROOM_CODE)}</b>　この部屋のURL：</span><input id="shareUrl" readonly value="${esc(url)}" style="flex:1 1 260px"><button class="btn small" id="copyUrl" data-label="URLをコピー">URLをコピー</button>`;
  $('#copyUrl').onclick=e=>copyText(url,e.currentTarget);})();
connect();
</script>

</body></html>
