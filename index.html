<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>仮想ドラフト2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--paper:#eef1f5;--card:#fff;--ink:#15213a;--muted:#5a6578;--line:#d6dce5;--accent:#1d4fa6;--accent-ink:#fff;
--display:"Dela Gothic One","Hiragino Sans",sans-serif;--body:"Zen Kaku Gothic New","Hiragino Sans","Meiryo",sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#0f1522;--card:#171f2f;--ink:#e5eaf2;--muted:#97a3b6;--line:#28334a;--accent:#7aa2ff;--accent-ink:#0b1220;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:40px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);font-weight:400;margin:0}h1{font-size:clamp(26px,5vw,38px)}h2{font-size:19px}
p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:18px}
a.card:hover{border-color:var(--accent)}a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.go{margin-top:auto;font-weight:700;color:var(--accent)}
</style></head><body>
<div class="wrap">
  <h1>仮想ドラフト2026</h1>
  <p>2026年10月22日のプロ野球ドラフト会議を、候補384人で再現します。1位は入札と抽選、2位以降はウェーバー方式です。</p>
  <div class="cards">
    <a class="card" href="solo.html"><h2>1人で遊ぶ</h2><p>中日の指名を担当し、他の11球団は各球団の傾向に沿って自動で指名します。補強ポイントの充足や結果の保存もできます。</p><span class="go">中日目線で始める →</span></a>
    <a class="card" href="multi.html"><h2>みんなで遊ぶ</h2><p>合言葉で同じ部屋に入り、それぞれが担当球団を持って指名します。人がいない球団は自動指名。アカウントは不要です。</p><span class="go">部屋に入る →</span></a>
  </div>
  <p style="font-size:12.5px">評価点や他球団の傾向は、報道をもとにした目安です。</p>
</div>
</body></html>
